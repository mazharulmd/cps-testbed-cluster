# Builds the container image (docker/Dockerfile) and publishes it to
# ghcr.io/<owner>/cps-testbed-cluster. Runs on version tags (v1.0, ...) and on demand
# (Actions → "Container image" → Run workflow). The build compiles GridPACK, HELICS and NS-3
# and takes about an hour.
name: Container image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cps-testbed-cluster
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: JOBS=4
          cache-from: type=gha
          cache-to: type=gha,mode=max
