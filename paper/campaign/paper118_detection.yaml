# Detection campaign: simple FDI of several sizes on bus 49 without a fault, estimator sigma 0.002 (default)
# and 0.001 (matched to the simulated noise), both placements, seeds 1-5; plus the AVR-fault attacks at bus 49
# with matched sigma (145 runs).
