# IEEE 118-bus fault campaign of the paper: load step, line trip, generator trip and bus fault,
# each with all attack types and both placements, five seeds (220 runs).
grid: ieee118
duration: 10
mpi_np: 1
seed: 1
pmu: {placement: minimum}
network: {latency_ms: 10, loss: 0, pdc_wait_ms: 20}
control: {bdd: true, voltage_control: true}
scenarios:
- name: f01-load53-noctl
  seed: 1
  mode: qss
  event: {type: load_step, bus: 53, pct: 200, t: 4}
  control: {bdd: true, voltage_control: false}
- name: f01-load53-ctl
  seed: 1
  mode: qss
  event: {type: load_step, bus: 53, pct: 200, t: 4}
- name: f01-load53-simple-min
  seed: 1
  mode: qss
  event: {type: load_step, bus: 53, pct: 200, t: 4}
  attack: {type: fdi-simple, target: 53, fake: 0.97, start: 4, end: 9, delay_ms: 100}
- name: f01-load53-simple-nobdd
  seed: 1
  mode: qss
  event: {type: load_step, bus: 53, pct: 200, t: 4}
  attack: {type: fdi-simple, target: 53, fake: 0.97, start: 4, end: 9, delay_ms: 100}
  control: {bdd: false, voltage_control: true}
- name: f01-load53-stealthy-min
  seed: 1
  mode: qss
  event: {type: load_step, bus: 53, pct: 200, t: 4}
  attack: {type: fdi-stealthy, target: 53, fake: 0.97, start: 4, end: 9, delay_ms: 100}
- name: f01-load53-delay-min
  seed: 1
  mode: qss
  event: {type: load_step, bus: 53, pct: 200, t: 4}
  attack: {type: delay, target: 53, fake: 0.97, start: 4, end: 9, delay_ms: 100}
- name: f01-load53-drop-min
  seed: 1
  mode: qss
  event: {type: load_step, bus: 53, pct: 200, t: 4}
  attack: {type: drop, target: 53, fake: 0.97, start: 4, end: 9, delay_ms: 100}
- name: f01-load53-simple-red
  seed: 1
  mode: qss
  event: {type: load_step, bus: 53, pct: 200, t: 4}
  pmu: {placement: redundant}
  attack: {type: fdi-simple, target: 53, fake: 0.97, start: 4, end: 9, delay_ms: 100}
