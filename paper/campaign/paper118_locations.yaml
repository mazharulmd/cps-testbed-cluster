# IEEE 118-bus location campaign: AVR faults at 16 generator buses and load steps at 4 load buses,
# each with every attack and both placements (seed 1), plus the SCADA-setpoint controller at 17 AVR locations.
grid: ieee118
duration: 10
mpi_np: 1
seed: 1
pmu: {placement: minimum}
network: {latency_ms: 10, loss: 0, pdc_wait_ms: 20}
control: {bdd: true, voltage_control: true}
scenarios:
- name: l-avr10-noctl
  event: {type: avr_fault, bus: 10, vset: 1.12, t: 4}
  control: {bdd: true, voltage_control: false}
- name: l-avr10-ctl
  event: {type: avr_fault, bus: 10, vset: 1.12, t: 4}
- name: l-avr10-simple-min
  event: {type: avr_fault, bus: 10, vset: 1.12, t: 4}
  attack: {type: fdi-simple, target: 10, fake: 1.02, start: 4, end: 9, delay_ms: 100}
- name: l-avr10-simple-red
  event: {type: avr_fault, bus: 10, vset: 1.12, t: 4}
  pmu: {placement: redundant}
  attack: {type: fdi-simple, target: 10, fake: 1.02, start: 4, end: 9, delay_ms: 100}
- name: l-avr10-stealthy-min
  event: {type: avr_fault, bus: 10, vset: 1.12, t: 4}
  attack: {type: fdi-stealthy, target: 10, fake: 1.02, start: 4, end: 9, delay_ms: 100}
- name: l-avr10-stealthy-red
  event: {type: avr_fault, bus: 10, vset: 1.12, t: 4}
  pmu: {placement: redundant}
  attack: {type: fdi-stealthy, target: 10, fake: 1.02, start: 4, end: 9, delay_ms: 100}
- name: l-avr10-delay-min
  event: {type: avr_fault, bus: 10, vset: 1.12, t: 4}
  attack: {type: delay, target: 10, fake: 1.02, start: 4, end: 9, delay_ms: 100}
- name: l-avr10-delay-red
  event: {type: avr_fault, bus: 10, vset: 1.12, t: 4}
  pmu: {placement: redundant}
  attack: {type: delay, target: 10, fake: 1.02, start: 4, end: 9, delay_ms: 100}
- name: l-avr10-drop-min
  event: {type: avr_fault, bus: 10, vset: 1.12, t: 4}
  attack: {type: drop, target: 10, fake: 1.02, start: 4, end: 9, delay_ms: 100}
- name: l-avr10-drop-red
  event: {type: avr_fault, bus: 10, vset: 1.12, t: 4}
  pmu: {placement: redundant}
  attack: {type: drop, target: 10, fake: 1.02, start: 4, end: 9, delay_ms: 100}
